<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>کۆگا | Koga</title>
<meta name="theme-color" content="#7C3AED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== Header ===== -->
<header class="topbar">
  <div class="cart-wrap">
    <button class="icon-btn cart-btn" id="cartBtn" aria-label="cart">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-badge" id="cartBadge" hidden>0</span>
    </button>
    <span class="cart-total" id="cartTotal" hidden>0</span>
  </div>

  <div class="brand">
    <span class="brand-name" id="brandName">کۆگا</span>
    <span class="brand-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 21V13h6v8"/></svg>
    </span>
  </div>

  <a class="phone-pill" id="whatsappBtn" href="https://wa.me/9647508457841" target="_blank" rel="noopener">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.87 9.87 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm0 18.14h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.11.82.83-3.03-.2-.31a8.19 8.19 0 0 1-1.26-4.39c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.83 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.55-3.7 8.23-8.25 8.23zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.4-.12-.56.13-.17.24-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.38-1.99-1.22-.74-.65-1.23-1.46-1.38-1.7-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.15.16-.25.25-.42.08-.16.04-.31-.02-.43-.06-.13-.56-1.34-.76-1.83-.2-.48-.41-.42-.56-.42-.14-.01-.31-.01-.48-.01a.9.9 0 0 0-.66.31c-.23.24-.87.85-.87 2.08 0 1.22.89 2.4 1.02 2.57.12.16 1.75 2.67 4.24 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.07-.11-.23-.17-.48-.29z"/></svg>
    <span dir="ltr">07508457841</span>
  </a>
</header>

<!-- ===== Subheader: menu + search + filter ===== -->
<div class="subbar">
  <div class="menu-wrap">
    <button class="icon-btn" id="menuBtn" aria-label="menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
    <div class="dropdown" id="dropdown">
      <button id="menuLang">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span id="menuLangText">گۆڕینی زمان</span>
      </button>
      <div class="lang-options" id="langOptions">
        <button data-lang="ku">کوردی (سۆرانی)</button>
        <button data-lang="ar">العربية</button>
        <button data-lang="en">English</button>
      </div>
      <button id="menuInfo">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span id="menuInfoText">زانیاری</span>
      </button>
      <button id="menuLogin">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        <span id="menuLoginText">چوونەژوورەوە</span>
      </button>
      <button id="menuLogout" style="display:none;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span id="menuLogoutText">دەرچوون</span>
      </button>
      <button id="menuAdd" style="display:none;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span id="menuAddText">زیادکردنی کاڵا</span>
      </button>
    </div>
  </div>

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="گەڕان...">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
  </div>

  <button class="icon-btn filter-btn" id="filterBtn" aria-label="filter">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="16" cy="12" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2" fill="currentColor" stroke="none"/></svg>
    <span class="filter-dot" id="filterDot" hidden></span>
  </button>
</div>

<!-- ===== Category horizontal scroller (Shein-style) ===== -->
<div class="cat-scroll-wrap">
  <div class="cat-scroll" id="catScroll"></div>
</div>

<!-- ===== Auto-sliding banner carousel ===== -->
<div class="carousel" id="carousel">
  <div class="carousel-track" id="carouselTrack">
    <div class="carousel-slide"><img src="https://i.ibb.co/XxZyZ4Zq/Neutral-Elegant-Minimalist-Beauty-Make-Up-Business-Card.png" alt="Banner 1" loading="lazy"></div>
    <div class="carousel-slide"><img src="https://i.ibb.co/yBpg1RHK/Neutral-Elegant-Minimalist-Beauty-Make-Up-Business-Card.jpg" alt="Banner 2" loading="lazy"></div>
  </div>
  <div class="carousel-dots" id="carouselDots"></div>
</div>

<!-- ===== Tabs ===== -->
<div class="tabs">
  <button class="tab-btn active" id="tabMain" data-section="main">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 21V13h6v8"/></svg>
    <span id="tabMainText">بەشی سەرەکی</span>
  </button>
  <button class="tab-btn" id="tabOffers" data-section="offers">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
    <span id="tabOffersText">بەشی ئۆفەر</span>
  </button>
  <button class="tab-btn" id="tabLocal" data-section="local">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 0C1.46 6.7 1.33 10.28 4 13l8 8 8-8c2.67-2.72 2.54-6.3.42-8.42z"/></svg>
    <span id="tabLocalText">بەرهەمی ناوخۆ</span>
  </button>
</div>

<!-- ===== Product grid ===== -->
<div class="grid" id="grid"></div>

<!-- ===== Detail modal ===== -->
<div class="overlay" id="detailOverlay">
  <div class="modal">
    <button class="modal-close" id="detailClose">✕</button>
    <div class="detail-img"><img id="detailImg" src="" alt="" referrerpolicy="no-referrer"></div>
    <h2 id="detailName" style="padding-left:0;"></h2>
    <div class="detail-row"><span id="lblCodeD">کۆدی کاڵا</span><span id="detailCode"></span></div>
    <div class="detail-row"><span id="lblCompanyD">ناوی کۆمپانیا</span><span id="detailCompany"></span></div>
    <div class="detail-row"><span id="lblPieceD">نرخی دانه</span><span id="detailPiece"></span></div>
    <div class="detail-row"><span id="lblCartonD">نرخی کارتۆن</span><span id="detailCarton"></span></div>
    <div class="detail-row"><span id="lblUnitsD">دانه/کارتۆن</span><span id="detailUnits"></span></div>
    <div class="detail-row"><span id="lblCatD">جۆر</span><span id="detailCat"></span></div>
    <div class="detail-row"><span id="lblBarcodeD">بارکۆد</span><span id="detailBarcode"></span></div>
    <div class="detail-desc" id="detailDesc"></div>
    <button class="btn btn-primary" id="detailAddCart" style="margin-top:14px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-left:6px;"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span id="detailAddCartText">زیادکردن بۆ سەبەتە</span>
    </button>
  </div>
</div>

<!-- ===== Information modal ===== -->
<div class="overlay" id="infoOverlay">
  <div class="modal" style="max-width:420px;">
    <button class="modal-close" id="infoClose">✕</button>
    <h2 id="infoTitle">زانیاری</h2>
    <p id="infoText" style="font-size:15px;line-height:2.1;color:var(--text);margin:0;white-space:pre-line;"></p>
  </div>
</div>

<!-- ===== Filter modal ===== -->
<div class="overlay" id="filterOverlay">
  <div class="modal">
    <button class="modal-close" id="filterClose">✕</button>
    <h2 id="filterTitle">پۆلەکان</h2>
    <div class="filter-cats" id="filterCats"></div>
    <div class="filter-sort-title" id="filterSortTitle">ڕیزکردن بەپێی نرخ</div>
    <div class="sort-row">
      <button class="sort-opt" id="sortLow" data-sort="low">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
        <span id="sortLowText">کەمترین نرخ</span>
      </button>
      <button class="sort-opt" id="sortHigh" data-sort="high">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <span id="sortHighText">زۆرترین نرخ</span>
      </button>
    </div>
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" id="filterResetBtn">پاکردنەوە</button>
      <button type="button" class="btn btn-primary" id="filterApplyBtn">جێبەجێکردن</button>
    </div>
  </div>
</div>

<!-- ===== Cart modal ===== -->
<div class="overlay" id="cartOverlay">
  <div class="modal">
    <button class="modal-close" id="cartClose">✕</button>
    <h2 id="cartTitle">سەبەتەی کڕین</h2>
    <div id="cartList"></div>
    <div class="cart-footer">
      <button type="button" class="btn btn-order" id="cartOrderBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-3px;margin-left:6px;"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.87 9.87 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm0 18.14h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.11.82.83-3.03-.2-.31a8.19 8.19 0 0 1-1.26-4.39c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.83 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.55-3.7 8.23-8.25 8.23z"/></svg>
        <span id="cartOrderText">داواکردن لە وەتساپ</span>
      </button>
    </div>
  </div>
</div>

<!-- ===== Admin login modal ===== -->
<div class="overlay" id="loginOverlay">
  <div class="modal" style="max-width:380px;">
    <button class="modal-close" id="loginClose">✕</button>
    <h2 id="loginTitle">چوونەژوورەوەی بەڕێوەبەر</h2>
    <form id="loginForm">
      <div class="field">
        <label id="lblEmail">ئیمەیل</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="field">
        <label id="lblPassword">وشەی نهێنی</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="loginCancelBtn">پاشگەزبوونەوه</button>
        <button type="submit" class="btn btn-primary" id="loginSubmitBtn">چوونەژوورەوە</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== Add/Edit form modal ===== -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <button class="modal-close" id="formClose">✕</button>
    <h2 id="formTitle">زیادکردنی کاڵا</h2>
    <form id="productForm">
      <input type="hidden" id="prodId">
      <div class="field">
        <label id="lblImage">لینکی وێنه (URL)</label>
        <div class="img-preview" id="imgPreview">وێنه لێرە دەردەکەوێت</div>
        <input type="url" id="fImage" placeholder="https://i.ibb.co/xxxx.jpg" required>
      </div>
      <div class="field">
        <label id="lblName">ناوی کاڵا <span class="req">*</span></label>
        <input type="text" id="fName" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label id="lblCode">کۆدی کاڵا</label>
          <input type="text" id="fCode">
        </div>
        <div class="field">
          <label id="lblCompany">ناوی کۆمپانیا</label>
          <input type="text" id="fCompany">
        </div>
      </div>
      <div class="field">
        <label id="lblCategory">جۆر / پۆل <span class="hint" id="lblCategoryHint">(دەتوانیت چەند پۆلێک هەڵبژێریت)</span></label>
        <div class="chip-select" id="fCategories"></div>
        <div class="cat-row">
          <input type="text" id="newCatInput" placeholder="پۆلی نوێ...">
          <button type="button" id="addCatBtn">+</button>
        </div>
      </div>
      <div class="field">
        <label id="lblSection">شوێنی دەرکەوتن</label>
        <div class="radio-row">
          <label class="radio-opt selected" id="optMain">
            <input type="radio" name="section" value="main" checked>
            <span id="optMainText">بەشی سەرەکی</span>
          </label>
          <label class="radio-opt" id="optOffers">
            <input type="radio" name="section" value="offers">
            <span id="optOffersText">بەشی ئۆفەر</span>
          </label>
          <label class="radio-opt" id="optLocal">
            <input type="radio" name="section" value="local">
            <span id="optLocalText">بەرهەمی ناوخۆ</span>
          </label>
        </div>
      </div>
      <div class="field">
        <label id="lblPiece">نرخی دانه <span class="req">*</span></label>
        <input type="text" id="fPiece" inputmode="decimal" placeholder="12500 یان $12.50" required>
      </div>
      <div class="field">
        <label id="lblCarton">نرخی کارتۆن</label>
        <input type="text" id="fCarton" inputmode="decimal" placeholder="12500 یان $12.50">
      </div>
      <div class="field">
        <label id="lblUnits">ژمارەی دانه له کارتۆنێکدا</label>
        <input type="number" id="fUnits" min="0" step="1">
      </div>
      <div class="field">
        <label id="lblBarcode">بارکۆد</label>
        <input type="text" id="fBarcode">
      </div>
      <div class="field">
        <label id="lblDesc">تێبینی / وردەکاری</label>
        <textarea id="fDesc"></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="cancelBtn">پاشگەزبوونەوه</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">پاشەکەوتکردن</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== Firebase SDK (compat build — plain <script> tags, no bundler needed) ===== -->
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
